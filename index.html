<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refrigerant Quantity Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">
    <div id="app"></div>

    <script>
        // Main App Component
        const app = document.getElementById('app');

        class RefrigerantCalculator {
            constructor() {
                this.refrigerant = 'R410A';
                this.finType = 'louvre';
                this.finnedLength = 500;
                this.spanLength = 200;
                this.tubesPerRow = 12;
                this.init();
            }

            init() {
                this.render();
                this.attachEventListeners();
            }

            calculate() {
                if (!this.finnedLength || !this.spanLength || !this.tubesPerRow) return [];

                const SPECIFIC_LENGTH = {
                    'R410A': 130,
                    'R32': 116
                };

                const specLength = SPECIFIC_LENGTH[this.refrigerant];
                const isEvenTubes = this.tubesPerRow % 2 === 0;
                
                let calculatedResults = [];

                // --- Calculation for 2x2 (Always calculated) ---
                let spanDivisor = this.refrigerant === 'R410A' ? 2.0 : 4.0;
                let fillingLength2x2 = this.finnedLength + (this.spanLength / spanDivisor);
                
                let circuitMultiplier = this.finType === 'louvre' ? 2.3 : 2.0;
                let oneCircuit = fillingLength2x2 * circuitMultiplier;
                
                let mass2x2 = (oneCircuit / 1000.0) * specLength;
                
                calculatedResults.push({
                    type: '2x2',
                    quantity: mass2x2,
                    description: 'Double circuit configuration'
                });

                // --- Calculation for 2x1 (Only if even tubes) ---
                if (isEvenTubes) {
                    let fillingLength2x1 = 2 * (this.finnedLength / 1000.0);
                    let massMultiplier = this.refrigerant === 'R410A' ? 1.15 : 1.05;
                    let mass2x1 = massMultiplier * fillingLength2x1 * specLength;

                    calculatedResults.push({
                        type: '2x1',
                        quantity: mass2x1,
                        description: 'Single parallel circuit configuration'
                    });
                }

                return calculatedResults;
            }

            render() {
                const results = this.calculate();
                const isOddTubes = this.tubesPerRow % 2 !== 0;

                app.innerHTML = `
                    <div class="min-h-screen bg-slate-950 text-slate-200 py-12 px-4 sm:px-6 lg:px-8 font-sans selection:bg-blue-500/30">
                        <div class="max-w-6xl mx-auto space-y-8">
                            
                            <!-- Header Section -->
                            <div class="text-center space-y-2">
                                <div class="inline-flex items-center justify-center p-3 bg-blue-900/30 rounded-2xl mb-4 border border-blue-500/20 shadow-lg shadow-blue-900/20">
                                    <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                                    </svg>
                                </div>
                                <h1 class="text-4xl font-extrabold tracking-tight text-white sm:text-5xl">
                                    Refrigerant Quantity
                                </h1>
                                <p class="text-lg text-slate-400 max-w-2xl mx-auto">
                                    Dynamic estimation tool for HVAC systems. Outputs valid circuit mass based on physical configurations.
                                </p>
                            </div>

                            <!-- Main Interface Grid -->
                            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                                
                                <!-- Left Panel: Input Controls -->
                                <div class="lg:col-span-5 bg-slate-900/50 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
                                    <div class="flex items-center gap-3 mb-6 pb-6 border-b border-slate-800">
                                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.325 15.581l-3.48-3.48m0 0a6.5 6.5 0 10-9.19 9.19m9.19-9.19L16.5 21m-4.175-4.175l.707-.707m0 0L9.172 9.172"></path>
                                        </svg>
                                        <h2 class="text-xl font-semibold text-white">System Parameters</h2>
                                    </div>

                                    <div class="space-y-6">
                                        <!-- Refrigerant Selection -->
                                        <div class="space-y-2">
                                            <label class="text-sm font-medium text-slate-400 flex items-center gap-2">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-9.414 9.414a1 1 0 00-.293.707V17l-4-4V7a1 1 0 01.293-.707l2.414-2.414A1 1 0 0110.586 4H7a1 1 0 00-1 1v2.586a1 1 0 01-.293.707L.293 17.414A1 1 0 000 18.121V21a1 1 0 001 1h3v-4.586a1 1 0 01.293-.707l9.414-9.414A1 1 0 0014 6V4z"></path>
                                                </svg>
                                                Refrigerant Type
                                            </label>
                                            <select id="refrigerant" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none appearance-none cursor-pointer hover:border-slate-700">
                                                <option value="R410A">R410A</option>
                                                <option value="R32">R32</option>
                                            </select>
                                        </div>

                                        <!-- Fin Type Selection -->
                                        <div class="space-y-2">
                                            <label class="text-sm font-medium text-slate-400 flex items-center gap-2">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                                </svg>
                                                Fin Type
                                            </label>
                                            <select id="finType" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none appearance-none cursor-pointer hover:border-slate-700">
                                                <option value="louvre">Louvre</option>
                                                <option value="sine wave">Sine Wave</option>
                                                <option value="corrugated">Corrugated</option>
                                            </select>
                                        </div>

                                        <!-- Length Inputs -->
                                        <div class="grid grid-cols-2 gap-4">
                                            <div class="space-y-2">
                                                <label class="text-sm font-medium text-slate-400 flex items-center gap-2">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                                                    </svg>
                                                    Finned Length
                                                </label>
                                                <div class="relative">
                                                    <input type="number" id="finnedLength" value="${this.finnedLength}" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-4 pr-10 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none hover:border-slate-700" />
                                                    <span class="absolute right-4 top-3.5 text-xs text-slate-500 font-medium">mm</span>
                                                </div>
                                            </div>

                                            <div class="space-y-2">
                                                <label class="text-sm font-medium text-slate-400 flex items-center gap-2">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                                                    </svg>
                                                    Span Length
                                                </label>
                                                <div class="relative">
                                                    <input type="number" id="spanLength" value="${this.spanLength}" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-4 pr-10 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none hover:border-slate-700" />
                                                    <span class="absolute right-4 top-3.5 text-xs text-slate-500 font-medium">mm</span>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Tubes Per Row -->
                                        <div class="space-y-2 pt-2">
                                            <label class="text-sm font-medium text-slate-400 flex items-center justify-between">
                                                <span class="flex items-center gap-2">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.325 15.581l-3.48-3.48m0 0a6.5 6.5 0 10-9.19 9.19m9.19-9.19L16.5 21m-4.175-4.175l.707-.707m0 0L9.172 9.172"></path>
                                                    </svg>
                                                    Tubes per Row
                                                </span>
                                                ${isOddTubes ? `
                                                    <span class="text-xs text-amber-500 flex items-center gap-1 bg-amber-500/10 px-2 py-1 rounded-md">
                                                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                                                            <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                                                        </svg>
                                                        Odd count restricts circuits
                                                    </span>
                                                ` : ''}
                                            </label>
                                            <input type="number" id="tubesPerRow" min="1" step="1" value="${this.tubesPerRow}" class="w-full bg-slate-950 border ${isOddTubes ? 'border-amber-500/50' : 'border-slate-800'} rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none hover:border-slate-700" />
                                        </div>
                                    </div>
                                </div>

                                <!-- Right Panel: Results -->
                                <div class="lg:col-span-7 space-y-6">
                                    <div class="bg-gradient-to-br from-blue-600/10 to-indigo-900/10 border border-blue-500/20 rounded-3xl p-6 sm:p-8">
                                        <div class="flex items-center gap-3 mb-8">
                                            <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                            </svg>
                                            <h2 class="text-2xl font-bold text-white">Calculated Mass</h2>
                                        </div>

                                        ${results.length > 0 ? `
                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                ${results.map(res => `
                                                    <div class="relative overflow-hidden bg-slate-900/80 border ${res.type === '2x2' ? 'border-blue-500/30' : 'border-emerald-500/30'} rounded-2xl p-6 transition-all duration-300 hover:scale-[1.02] hover:shadow-xl ${res.type === '2x2' ? 'hover:shadow-blue-900/20' : 'hover:shadow-emerald-900/20'}">
                                                        <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full blur-3xl opacity-20 ${res.type === '2x2' ? 'bg-blue-500' : 'bg-emerald-500'}"></div>
                                                        <div class="relative z-10">
                                                            <div class="flex items-center justify-between mb-4">
                                                                <span class="px-3 py-1 text-xs font-bold uppercase tracking-wider rounded-lg ${res.type === '2x2' ? 'bg-blue-500/20 text-blue-300' : 'bg-emerald-500/20 text-emerald-300'}">
                                                                    ${res.type} Circuit
                                                                </span>
                                                            </div>
                                                            <div class="flex items-baseline gap-2 mb-2">
                                                                <span class="text-5xl font-black text-white tracking-tight">
                                                                    ${res.quantity.toFixed(1)}
                                                                </span>
                                                                <span class="text-xl font-medium text-slate-400">g</span>
                                                            </div>
                                                            <p class="text-sm text-slate-500 leading-relaxed mt-4 border-t border-slate-800 pt-4">
                                                                ${res.description}
                                                            </p>
                                                        </div>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        ` : `
                                            <div class="flex flex-col items-center justify-center py-12 text-center border-2 border-dashed border-slate-800 rounded-2xl">
                                                <svg class="w-12 h-12 text-slate-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                                </svg>
                                                <p class="text-slate-400 text-lg">Please enter valid dimensions to calculate quantities.</p>
                                            </div>
                                        `}
                                    </div>

                                    ${isOddTubes ? `
                                        <div class="bg-amber-950/30 border border-amber-500/20 rounded-2xl p-4 flex items-start gap-4 animate-in fade-in slide-in-from-bottom-4">
                                            <div class="bg-amber-500/20 p-2 rounded-lg shrink-0">
                                                <svg class="w-5 h-5 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
                                                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                                                </svg>
                                            </div>
                                            <div>
                                                <h4 class="text-sm font-semibold text-amber-200">2x1 Circuit Hidden</h4>
                                                <p class="text-sm text-amber-400/80 mt-1">
                                                    An odd number of tubes (${this.tubesPerRow}) restricts the configuration. The 2x1 circuit calculation is only valid and displayed for an even number of tubes per row.
                                                </p>
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            attachEventListeners() {
                document.getElementById('refrigerant').addEventListener('change', (e) => {
                    this.refrigerant = e.target.value;
                    this.render();
                    this.attachEventListeners();
                });

                document.getElementById('finType').addEventListener('change', (e) => {
                    this.finType = e.target.value;
                    this.render();
                    this.attachEventListeners();
                });

                document.getElementById('finnedLength').addEventListener('input', (e) => {
                    this.finnedLength = parseFloat(e.target.value) || 0;
                    this.render();
                    this.attachEventListeners();
                });

                document.getElementById('spanLength').addEventListener('input', (e) => {
                    this.spanLength = parseFloat(e.target.value) || 0;
                    this.render();
                    this.attachEventListeners();
                });

                document.getElementById('tubesPerRow').addEventListener('input', (e) => {
                    this.tubesPerRow = parseInt(e.target.value, 10) || 0;
                    this.render();
                    this.attachEventListeners();
                });
            }
        }

        // Initialize app
        new RefrigerantCalculator();
    </script>
</body>
</html>
